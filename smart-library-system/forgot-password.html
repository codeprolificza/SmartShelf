<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - University Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        a { text-decoration: none; }

        nav {
            height: 75px;
            background: #071a2b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: sticky;
            top: 0;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span { color: #00a8ff; }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            font-size: 16px;
        }

        .reset-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .reset-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .reset-card h2 {
            color: #071a2b;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .reset-card p.subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            text-align: left;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            margin-bottom: 8px;
        }

        input:focus { border-color: #00a8ff; }

        .field-error {
            display: none;
            color: #d63031;
            font-size: 12px;
            text-align: left;
            margin-bottom: 10px;
        }

        .reset-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .reset-btn:hover { background: #0077b6; }

        .success-box {
            display: none;
            background: #eaf7ff;
            color: #071a2b;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 18px;
            text-align: left;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            color: #00a8ff;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .reset-card { padding: 30px 22px; }
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">Uni<span>Library</span></div>
        <ul class="nav-links">
            <li><a href="index.html" style="color:white;">Home</a></li>
        </ul>
    </nav>

    <div class="reset-wrapper">

        <div class="reset-card">

            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your UFH email and we'll send you a link to reset your password.</p>

            <form id="resetForm" onsubmit="handleReset(event)">

                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" placeholder="user@ufh.ac.za" required>
                <p class="field-error" id="resetEmailError">Please use your @ufh.ac.za email address.</p>

                <button type="submit" class="reset-btn">Send Reset Link</button>

            </form>

            <div class="success-box" id="successBox">
                ✅ If an account exists for that email, a password reset link has been sent. Please check your inbox.
            </div>

            <a href="login.html" class="back-login">← Back to login</a>

        </div>

    </div>

    <script>

        function handleReset(e) {
            e.preventDefault();

            let email = document.getElementById('resetEmail').value.trim().toLowerCase();
            let errorMsg = document.getElementById('resetEmailError');
            let successBox = document.getElementById('successBox');

            if (!email.endsWith('@ufh.ac.za')) {
                errorMsg.style.display = "block";
                successBox.style.display = "none";
                return;
            }

            errorMsg.style.display = "none";

            // In the real system, PHP would generate a secure reset link
            // and email it to the user here. For now we just show a confirmation.
            successBox.style.display = "block";
            document.getElementById('resetForm').reset();
        }

    </script>

</body>
</html>
