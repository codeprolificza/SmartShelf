<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - University Library</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; }
        a { text-decoration: none; }

        nav {
            height: 75px; background: #071a2b; display: flex; align-items: center;
            justify-content: space-between; padding: 0 7%; position: sticky; top: 0;
        }
        .logo { color: white; font-size: 25px; font-weight: bold; }
        .logo span { color: #00a8ff; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: white; font-size: 16px; }
        .nav-links a:hover { color: #00a8ff; }

        .page-header { background: #071a2b; color: white; padding: 40px 7%; }
        .page-header h1 { font-size: 30px; margin-bottom: 8px; }
        .page-header h1 span { color: #00a8ff; }
        .page-header p { color: #ccc; }

        .content { padding: 45px 7%; max-width: 700px; margin: 0 auto; }

        .profile-card {
            background: white; border-radius: 10px; padding: 35px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06); margin-bottom: 30px;
        }

        .avatar-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .avatar {
            width: 70px; height: 70px; border-radius: 50%; background: #00a8ff;
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold;
        }
        .avatar-row h2 { color: #071a2b; font-size: 20px; }
        .avatar-row p { color: #777; font-size: 14px; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; margin-top: 16px; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #00a8ff; }
        input[disabled] { background: #f4f6f8; color: #888; }

        .save-btn {
            background: #00a8ff; color: white; border: none; padding: 12px 28px;
            border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 24px;
        }
        .save-btn:hover { background: #0077b6; }

        .stat-mini { display: flex; gap: 15px; margin-top: 10px; }
        .stat-box {
            flex: 1; background: #f4f6f8; border-radius: 8px; padding: 16px; text-align: center;
        }
        .stat-box h3 { color: #00a8ff; font-size: 22px; }
        .stat-box p { color: #666; font-size: 12px; }

        @media(max-width: 650px) { .nav-links { display: none; } }
    </style>
</head>
<body>

    <div style="background:#050f1c; color:#9db4c9; font-size:12px; padding:8px 7%; display:flex; justify-content:flex-end; gap:22px; flex-wrap:wrap;">
        <a href="index.html" style="color:#9db4c9; text-decoration:none;">Home</a>
        <a href="dashboard-student.html" style="color:#9db4c9; text-decoration:none;">My Account</a>
        <a href="recommend-purchase.html" style="color:#9db4c9; text-decoration:none;">Recommend a Purchase</a>
        <a href="forgot-password.html" style="color:#9db4c9; text-decoration:none;">Help</a>
    </div>


    <nav>
        <div class="logo">Uni<span>Library</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard-student.html">My Dashboard</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>My <span>Profile</span></h1>
        <p>View and update your account details.</p>
    </div>

    <div class="content">

        <div class="profile-card">

            <div class="avatar-row">
                <div class="avatar">LR</div>
                <div>
                    <h2>Luthando Rungqu</h2>
                    <p>Student · BSc Computer Science and Mathematics</p>
                </div>
            </div>

            <div class="stat-mini">
                <div class="stat-box"><h3>3</h3><p>Books Borrowed</p></div>
                <div class="stat-box"><h3>1</h3><p>Currently Out</p></div>
                <div class="stat-box"><h3>2</h3><p>Interests Set</p></div>
            </div>

            <form onsubmit="saveProfile(event)">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" value="Luthando Rungqu">

                <label for="email">Email</label>
                <input type="email" id="email" value="luthando.rungqu@ufh.ac.za" disabled>

                <label for="degree">Programme of Study</label>
                <input type="text" id="degree" value="BSc Computer Science and Mathematics">

                <button type="submit" class="save-btn">Save Changes</button>

            </form>

        </div>

    </div>

    <script>
        function saveProfile(e) {
            e.preventDefault();
            alert("Profile updated (Note: this doesn't save permanently yet — a backend is needed for that.)");
        }
    </script>

</body>
</html>
