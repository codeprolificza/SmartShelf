<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        a {
            text-decoration: none;
        }

        /* NAV - matches homepage */

        nav {
            height: 75px;
            background: #071a2b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: sticky;
            top: 0;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #00a8ff;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #00a8ff;
        }

        /* LOGIN CARD */

        .login-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .login-card h2 {
            color: #071a2b;
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card p.subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
        }

        .role-select {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-option {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            color: #555;
            font-size: 14px;
            transition: 0.2s;
        }

        .role-option.active {
            border-color: #00a8ff;
            background: #eaf7ff;
            color: #071a2b;
            font-weight: bold;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            margin-top: 18px;
        }

      input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #d9e0e6;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: #fafcfe;
    color: #222;
    transition: 0.2s;
}

input[type="email"]:focus,
input[type="password"]:focus {
    border-color: #00a8ff;
    background: white;
    box-shadow: 0 0 0 3px rgba(0, 168, 255, 0.10);
}

input[type="email"]::placeholder {
    color: #9aa7b2;
}

        .login-btn-submit {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn-submit:hover {
            background: #0077b6;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00a8ff;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .login-card {
                padding: 30px 22px;
            }
            .login-card h2 {
                font-size: 24px;
            }
            .role-select {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <nav>
        <div class="logo">Uni<span>Library</span></div>
        <ul class="nav-links">
        </ul>
    </nav>

    <div class="login-wrapper">

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to continue to UniLibrary</p>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <label>I am a:</label>
                <div class="role-select" id="roleSelect">
                    <div class="role-option active" data-role="student" onclick="selectRole(this)">Student</div>
                    <div class="role-option" data-role="staff" onclick="selectRole(this)">Staff</div>
                    <div class="role-option" data-role="admin" onclick="selectRole(this)">Admin</div>
                </div>

                <label for="username">Email</label>
                <input type="email" id="username" name="username" placeholder="e.g. 202412345@ufh.ac.za" required>
                <p id="emailError" style="display:none; color:#d63031; font-size:13px; margin-top:6px;"></p>
                <p id="accountError" style="display:none; color:#d63031; font-size:13px; margin-top:6px;"></p>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6">
                <p id="passwordError" style="display:none; color:#d63031; font-size:13px; margin-top:6px;">Password must be at least 6 characters.</p>

                <button type="submit" class="login-btn-submit">Log In</button>

            </form>

            <a href="/forgot-password" class="back-home">Forgot your password?</a>
            <a href="/register" class="back-home">Don't have an account? Sign up</a>
            <a href="/" class="back-home">← Back to homepage</a>

        </div>

    </div>

    <script>

        let currentRole = "student";

        function selectRole(el) {
            document.querySelectorAll('.role-option').forEach(function(opt) {
                opt.classList.remove('active');
            });
            el.classList.add('active');
            currentRole = el.getAttribute('data-role');
        const emailInput = document.getElementById('username');

        if (currentRole === "student") {
        emailInput.placeholder = "e.g. 202412345@ufh.ac.za";
    } else {
        emailInput.placeholder = "e.g. 20245@ufh.ac.za";
    }

    }



        function handleLogin(e) {
            e.preventDefault();

            let email = document.getElementById('username').value.trim().toLowerCase();
            let password = document.getElementById('password').value;
            let emailError = document.getElementById('emailError');
            let passwordError = document.getElementById('passwordError');
            let accountError = document.getElementById('accountError');

            emailError.style.display = "none";
            passwordError.style.display = "none";
            accountError.style.display = "none";

            let studentPattern = /^\d{9}@ufh\.ac\.za$/;
            let staffAdminPattern = /^\d{5}@ufh\.ac\.za$/;

            let emailValid = (currentRole === "student") ? studentPattern.test(email) : staffAdminPattern.test(email);

            if (!emailValid) {
                emailError.textContent = (currentRole === "student")
                    ? "Student email must be 9 digits followed by @ufh.ac.za (e.g. 202412345@ufh.ac.za)."
                    : "Staff/Admin email must be 5 digits followed by @ufh.ac.za (e.g. 12345@ufh.ac.za).";
                emailError.style.display = "block";
                return;
            }

            if (password.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters.";
                passwordError.style.display = "block";
                return;
            }

            // Real backend: checks the PostgreSQL 'member' table
            // (now supports all three roles via the 'role' column)
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, role: currentRole })
            })
            .then(res => res.json().then(data => ({ status: res.status, data: data })))
            .then(result => {
                if (result.status !== 200) {

                    if (result.status === 403) {
        accountError.textContent = result.data.error;
        accountError.style.display = "block";
        return;
    }

                    if (result.data.error.toLowerCase().includes("password")) {
                        passwordError.textContent = result.data.error;
                        passwordError.style.display = "block";
                    } else {
                        emailError.textContent = result.data.error;
                        emailError.style.display = "block";
                    }
                    return;
                }
               const successMessage = document.createElement("p");
successMessage.textContent = "Login successful. Welcome to UniLibrary!";
successMessage.style.color = "#16803c";
successMessage.style.background = "#eaf8ef";
successMessage.style.border = "1px solid #b7e4c7";
successMessage.style.padding = "10px";
successMessage.style.borderRadius = "6px";
successMessage.style.textAlign = "center";
successMessage.style.marginTop = "15px";

document.getElementById("loginForm").appendChild(successMessage);

setTimeout(() => {
    window.location.href = result.data.redirect;
}, 1000);
            })
            .catch(() => {
                emailError.textContent = "Could not reach the server. Is Flask running?";
                emailError.style.display = "block";
            });
        }

    </script>

</body>
</html>
