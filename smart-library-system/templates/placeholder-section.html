<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - University Library</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; }
        a { text-decoration: none; }

        nav {
            height: 75px; background: #071a2b; display: flex; align-items: center;
            justify-content: space-between; padding: 0 7%; position: sticky; top: 0;
        }
        .logo { color: white; font-size: 25px; font-weight: bold; }
        .logo span { color: #00a8ff; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: white; font-size: 16px; }
        .nav-links a:hover { color: #00a8ff; }

        .page-header { background: #071a2b; color: white; padding: 40px 7%; }
        .page-header h1 { font-size: 30px; margin-bottom: 8px; }
        .page-header p { color: #ccc; }

        .content { padding: 45px 7%; }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            background: white; border-radius: 10px; padding: 28px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06); text-align: center; position: relative;
        }

        .card .icon { font-size: 38px; margin-bottom: 14px; }
        .card h3 { color: #071a2b; font-size: 16px; margin-bottom: 8px; }
        .card p { color: #777; font-size: 13px; }

        .badge {
            position: absolute; top: 12px; right: 12px; font-size: 10px;
            padding: 4px 9px; border-radius: 10px; font-weight: bold;
        }
        .badge.soon { background: rgba(0,168,255,0.12); color: #00a8ff; }
        .badge.available { background: rgba(46,204,113,0.15); color: #1f9d55; }

        @media(max-width: 1000px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 650px) { .nav-links { display: none; } .cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Uni<span>Library</span></div>
        <ul class="nav-links">
            <li><a href="/search">Books</a></li>
            <li><a href="/account">My Account</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>{{ page_title }}</h1>
        <p>{{ page_subtitle }}</p>
    </div>

   <div class="content">
    <div class="cards">

        {% for card in cards %}
        <div class="card">

            {% if card.available %}
            <span class="badge available">Available</span>
            {% else %}
            <span class="badge soon">Coming Soon</span>
            {% endif %}

            <div class="icon">{{ card.icon }}</div>
            <h3>{{ card.title }}</h3>
            <p>{{ card.desc }}</p>

            {% if card.url %}
            <a href="{{ card.url }}" target="_blank"
               style="display:inline-block; margin-top:15px; padding:10px 18px; background:#00a8ff; color:white; border-radius:6px;">
                Browse E-Books
            </a>
            {% endif %}

        </div>
        {% endfor %}

    </div>
</div>
</body>
</html>
