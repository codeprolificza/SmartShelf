<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - University Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .top-bar {
            background: #050f1c;
            color: #9db4c9;
            font-size: 12px;
            padding: 8px 7%;
            text-align: right;
        }

        .top-bar a {
            color: #9db4c9;
            text-decoration: none;
            margin-left: 22px;
        }

        nav {
            height: 75px;
            background: #071a2b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #00a8ff;
        }

        .reset-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .reset-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h2 {
            color: #071a2b;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #00a8ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0077b6;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            background: #ffeaea;
            color: #c0392b;
        }

        .success {
            background: #eaf7ff;
            color: #071a2b;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00a8ff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <a href="/">Home</a>
        <a href="/account">My Account</a>
        <a href="/forgot-password">Forgot Password</a>
    </div>

    <nav>
        <div class="logo">Uni<span>Library</span></div>
    </nav>

    <div class="reset-wrapper">

        <div class="reset-card">

            <h2>Reset Password</h2>

            <p class="subtitle">
                Enter your new password below.
            </p>

            <form id="resetForm" onsubmit="resetPassword(event)">

                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <div id="errorMessage" class="message error"></div>

            <div id="successMessage" class="message success">
                Password reset successfully. You can now log in with your new password.
            </div>

            <a href="/login" class="back-login">
                ← Back to login
            </a>

        </div>

    </div>

    <script>

        const resetToken = "{{ token }}";

        async function resetPassword(e) {

            e.preventDefault();

            const newPassword =
                document.getElementById('newPassword').value;

            const confirmPassword =
                document.getElementById('confirmPassword').value;

            const errorMessage =
                document.getElementById('errorMessage');

            const successMessage =
                document.getElementById('successMessage');

            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            if (newPassword !== confirmPassword) {
                errorMessage.textContent =
                    "The passwords do not match.";
                errorMessage.style.display = "block";
                return;
            }

            if (newPassword.length < 6) {
                errorMessage.textContent =
                    "Password must be at least 6 characters.";
                errorMessage.style.display = "block";
                return;
            }

            try {

                const response = await fetch('/api/reset-password', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        token: resetToken,
                        password: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent =
                        data.error || "Could not reset password.";
                    errorMessage.style.display = "block";
                    return;
                }

                successMessage.style.display = "block";

                document.getElementById('resetForm').reset();

            } catch (error) {

                errorMessage.textContent =
                    "Could not connect to the server.";

                errorMessage.style.display = "block";
            }
        }

    </script>

    {% include '_password_toggle.html' %}
</body>
</html>
