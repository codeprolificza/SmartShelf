<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - University Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        a { text-decoration: none; }

        nav {
            height: 75px;
            background: #071a2b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: sticky;
            top: 0;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span { color: #00a8ff; }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            font-size: 16px;
        }

        .nav-links a:hover { color: #00a8ff; }

        .signup-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .signup-card {
            background: white;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .signup-card h2 {
            color: #071a2b;
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }

        .signup-card p.subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00a8ff;
        }

        .role-option.active {
            border-color: #00a8ff !important;
            background: #eaf7ff;
            color: #071a2b !important;
            font-weight: bold;
        }

        .field-error {
            display: none;
            color: #d63031;
            font-size: 12px;
            margin-top: 5px;
        }

        .signup-btn {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #0077b6;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00a8ff;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .signup-card {
                padding: 30px 22px;
            }
            .signup-card h2 {
                font-size: 24px;
            }
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">Uni<span>Library</span></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
        </ul>
    </nav>

    <div class="signup-wrapper">

        <div class="signup-card">

            <h2>Create Account</h2>
            <p class="subtitle">Sign up with your UFH student email</p>

            <form id="signupForm" onsubmit="handleSignup(event)">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required>

                <label for="studentEmail">Student Email</label>
                <input type="email" id="studentEmail" placeholder="e.g. 202412345@ufh.ac.za" required>
                <p class="field-error" id="emailError">Please use your @ufh.ac.za email address.</p>

                <label for="faculty">Faculty</label>
                <select id="faculty" style="width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none;">
                    <option value="">Select your faculty</option>
                    <option>Science and Agriculture</option>
                    <option>Education</option>
                    <option>Health Sciences</option>
                    <option>Social Sciences and Humanities</option>
                    <option>Law, Management and Commerce</option>
                </select>

                <label for="department">Department</label>
<input
    type="text"
    id="department"
    placeholder="Enter your department"
>

<label for="programme">Programme</label>
<input
    type="text"
    id="programme"
    placeholder="Enter your programme"
>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required>
                <p class="field-error" id="passwordError">Passwords do not match.</p>

                <button type="submit" class="signup-btn">Sign Up</button>

            </form>

            <p style="text-align:center; color:#999; font-size:12px; margin-top:14px;">Staff and Admin accounts are created by a library administrator, not through this page.</p>

            <a href="/login" class="login-link">Already have an account? Log in</a>

        </div>

    </div>

    <script>

        function handleSignup(e) {
            e.preventDefault();

            let fullName = document.getElementById('fullName').value.trim();
            let email = document.getElementById('studentEmail').value.trim().toLowerCase();
         let faculty = document.getElementById('faculty').value;
let department = document.getElementById('department').value.trim();
let programme = document.getElementById('programme').value.trim();
let pass = document.getElementById('signupPassword').value;
            let confirmPass = document.getElementById('confirmPassword').value;

            let emailError = document.getElementById('emailError');
            let passwordError = document.getElementById('passwordError');

            emailError.style.display = "none";
            passwordError.style.display = "none";

            let studentPattern = /^\d{9}@ufh\.ac\.za$/;

            if (!studentPattern.test(email)) {
                emailError.textContent = "Student email must be 9 digits followed by @ufh.ac.za (e.g. 202412345@ufh.ac.za).";
                emailError.style.display = "block";
                return;
            }

            if (pass.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters.";
                passwordError.style.display = "block";
                return;
            }
            if (pass !== confirmPass) {
                passwordError.textContent = "Passwords do not match.";
                passwordError.style.display = "block";
                return;
            }

            // Real backend: saves to the PostgreSQL 'member' table
            // (now supports all three roles via the 'role' column)
            let nameParts = fullName.split(" ");
            let firstName = nameParts[0];
            let lastName = nameParts.slice(1).join(" ") || firstName;

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
    firstName: firstName,
    lastName: lastName,
    email: email,
    password: pass,
    faculty: faculty,
    department: department,
    programme: programme
})
            })
            .then(res => res.json().then(data => ({ status: res.status, data: data })))
            .then(result => {
                if (result.status !== 200) {
                    emailError.textContent = result.data.error;
                    emailError.style.display = "block";
                    return;
                }
                alert("Account created! You can now log in.");
                window.location.href = "/login";
            })
            .catch(() => {
                emailError.textContent = "Could not reach the server. Is Flask running?";
                emailError.style.display = "block";
            });
        }

    </script>

</body>
</html>
